name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  module-boundaries:
    name: Module boundary check (dependency-cruiser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Enforce module dependency boundaries (AD-1)
        run: npm run depcruise
